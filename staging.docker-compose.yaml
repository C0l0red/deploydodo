name: deploydodo-staging
services:
  dododb:
    image: postgres:15.18-alpine3.24
    environment:
      POSTGRES_USER: deploydodo
      POSTGRES_PASSWORD: deploydodo
      POSTGRES_DB: deploydodo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploydodo -d deploydodo"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - dododb-data:/var/lib/postgresql/data
    networks:
      - dodonet
    restart: unless-stopped

  deploydodo:
    env_file: local.env
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "deploydodo.host:host-gateway"
    volumes:
      - ./key_rsa:/key_rsa
    ports:
      - "3000:3000"
    networks:
      - dodonet
    depends_on:
      dododb:
        condition: service_healthy
    restart: unless-stopped

networks:
  dodonet:
    internal: true

volumes:
  dododb-data:
