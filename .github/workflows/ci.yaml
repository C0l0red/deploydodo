name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yaml"

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-fix:
    name: cargo fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        name: Cache rust dependencies
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-debug-${{ runner.os }}

      - name: Run cargo fix
        run: cargo fix --workspace --all-targets --allow-dirty --allow-staged

      - name: Fail if cargo fix found unapplied fixes
        run: git diff --exit-code

  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Clippy
        run: cargo clippy

  build:
    needs: [cargo-clippy, cargo-fix, cargo-fmt]
    name: cargo make build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        name: Cache rust dependencies
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-debug-${{ runner.os }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install cargo-make
        uses: taiki-e/install-action@cargo-make

      - name: Build
        run: cargo make build-debug
  test-backend:
    needs: [cargo-clippy, cargo-fix, cargo-fmt]
    name: Test backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://deploydodo:deploydodo@localhost:5432/deploydodo
      LOCAL_SSH_HOSTNAME: localhost
      LOCAL_SSH_PORT: 22
      LOCAL_SSH_USERNAME: root
    services:
      postgres:
        image: postgres:15.18-alpine3.24
        env:
          POSTGRES_USER: deploydodo
          POSTGRES_PASSWORD: deploydodo
          POSTGRES_DB: deploydodo
        # Ensure the runner waits until Postgres is completely healthy
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        name: Cache rust dependencies
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-debug-${{ runner.os }}

      - name: Install Binaries
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,sqlx-cli

      - name: Run DB Migrations
        run: cargo make migrate

      - name: Check SQL query
        run: cargo make check-query

      - name: Generate RSA
        run: ./configure_rsa.sh

      - name: Test
        env:
          SQLX_OFFLINE: true
        run: cargo test
